# ===================================================================
# APPLICATION & SERVER
# ===================================================================
spring.application.name=mini-transaction-settlement
server.port=8080
server.shutdown=graceful

# ===================================================================
# DATABASE
# ===================================================================
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.connection-fetch=lazy
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# HIKARI CONNECTION POOL OPTIMIZATION
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA & HIBERNATE
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

#spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# KAFKA
# ===================================================================
spring.kafka.bootstrap-servers=${KAFKA_URL}

spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.endpoint.identification.algorithm=https

spring.kafka.ssl.trust-store-type=JKS
spring.kafka.ssl.trust-store-location=${TRUSTORE_FILE}
spring.kafka.properties.ssl.truststore.password=${TRUSTORE_PASSWORD}

spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=${KEYSTORE_FILE}
spring.kafka.properties.ssl.keystore.password=${KEYSTORE_PASSWORD}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=txn-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dwish.minitrxsettlement.dto

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
#logging.level.root=INFO
#logging.structured.format.console=ecs

# ===================================================================
# ACTUATOR & MONITORING (HEALTH CHECK)
# ===================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# ===================================================================
# SWAGGER CONFIG
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method